[package]
name = "altar-save"
version = "0.1.0"
description = "Sincroniza saves de emuladores com a nuvem (Cloudflare R2 / Amazon S3)"
authors = ["Jonas Carvalho"]
edition = "2024"

[lib]
# The `_lib` suffix is necessary to make the lib name unique and not conflict with the bin name on Windows.
name = "altar_save_lib"
# Só desktop: `staticlib` e `cdylib` servem apenas para Android/iOS e geravam mais de 1 GB a cada build.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
async-trait = "0.1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
aws-sdk-s3 = "1"
notify = "8"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
dirs = "6"
encoding_rs = "0.8"

[dev-dependencies]
tempfile = "3"

# Desenvolvimento: debug info só com números de linha no nosso código e nenhuma nas dependências.
# Sem isso, `target/debug` passava de 8 GB.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
